# Render blueprint — https://render.com/docs/blueprint-spec
# Creates a free PostgreSQL database and wires DATABASE_URL automatically.
# Only two env vars need to be set manually in the Render dashboard:
#   ADMIN_PASSWORD  — your chosen password for admin.php
#   API_KEY         — already defaults to your key; set here to override

databases:
  - name: world-cup2026-db
    plan: free
    databaseName: worldcup2026

services:
  - type: web
    name: world-cup2026
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Render injects DATABASE_URL automatically from the linked database above.
      - key: DATABASE_URL
        fromDatabase:
          name: world-cup2026-db
          property: connectionString
      # API-SPORTS key — used by widgets on index.html (client-side).
      - key: API_KEY
        value: ec434bd351885afe9375a8ae3fd43003
      # football-data.org key — used server-side by cron.php to fetch scores.
      # Free plan covers World Cup 2026.
      - key: FD_API_KEY
        sync: false
      # Set this in the Render dashboard — Environment → ADMIN_PASSWORD
      - key: ADMIN_PASSWORD
        sync: false
