name: Sync World Cup Scores

# Auto-syncs match results every 15 minutes — but ONLY during the
# World Cup 2026 window (11 Jun – 19 Jul 2026).
#
# How the start/stop works (GitHub cron has no start/end date):
#  - the schedule only fires in June & July (cron months 6,7),
#  - only during hours when matches are live (15:00–05:59 UTC — WC games
#    are played in the Americas, roughly 16:00 UTC to ~04:00 UTC), and
#  - the "Tournament window" step below skips the sync unless today's
#    UTC date is within 2026-06-11 .. 2026-07-19.
# So it effectively starts when the Cup begins, syncs every 15 min while
# games are on, and goes dormant (no-op) once it ends — including future
# years. The ~09:00–14:00 UTC gap each day has no live matches.
#
# Manual runs are always allowed via the "Run workflow" button (and the
# in-app Sync Scores button) for anything outside these hours.
#
# Requires an ADMIN_PASSWORD repo secret (same value as the Render env var):
#   GitHub repo → Settings → Secrets and variables → Actions → New secret

on:
  schedule:
    # every 15 min, June & July, during live-match hours only (UTC)
    - cron: '*/15 0-5,15-23 * 6,7 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Tournament window check
        id: window
        run: |
          today=$(date -u +%F)
          if [[ "$today" > "2026-06-10" && "$today" < "2026-07-20" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Within World Cup window ($today) — syncing."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside World Cup window ($today) — skipping."
          fi

      - name: Call cron.php
        if: steps.window.outputs.active == 'true'
        run: |
          curl --fail --silent --show-error \
            "https://world-cup2026.onrender.com/cron.php?key=${{ secrets.ADMIN_PASSWORD }}"
