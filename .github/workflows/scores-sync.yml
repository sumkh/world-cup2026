name: Sync World Cup Scores

# ─────────────────────────────────────────────────────────────────────────────
# RETIRED — kept as a reference implementation, not as live automation.
#
# The World Cup 2026 tournament finished on 2026-07-19 and the Render
# deployment it called (https://world-cup2026.onrender.com/cron.php) was
# retired in September 2026. The `schedule:` trigger has therefore been
# removed: with the backend gone it would have woken every 15 minutes each
# June and July from 2027 onward to curl a dead host.
#
# The original schedule is preserved below for anyone reusing this pattern.
# GitHub cron has no start/end date, so a bounded tournament window was faked
# with three stacked filters:
#
#   on:
#     schedule:
#       # every 15 min, June & July only, during live-match hours (UTC)
#       - cron: '*/15 0-5,15-23 * 6,7 *'
#
#   ...plus the "Tournament window check" step below, which no-ops unless
#   today's UTC date falls inside 2026-06-11 .. 2026-07-19.
#
#   1. cron months 6,7      → dormant for ten months of the year
#   2. cron hours 0-5,15-23 → skips the ~09:00-14:00 UTC daily gap with no
#                             live matches (WC games run in the Americas)
#   3. the date-window step → bounds it to the actual tournament, and keeps it
#                             dormant in every future year
#
# Re-arming this requires: a live deployment, an ADMIN_PASSWORD repo secret,
# and restoring the `schedule:` block above with fresh dates.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: |
          echo "This workflow is retired — the Render backend was shut down in Sept 2026."
          echo "See backup/README.md for the archived data and how to stand the app back up."
          exit 1

